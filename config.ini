[IMAGE_CONFIGURATION]

# Abilita o disabilita la fase di conversione dei file PE in immagini
# 1 -> esegue la conversione
# 0 -> salta questa fase
enabled = 0

# Path della cartella che contiene i file PE Windows da convertire
filesPath = dataset/train/samples

# Path del file CSV che contiene le label dei file PE
labelsPath = dataset/train/labels.csv

# Path della cartella in cui salvare le immagini generate
imagesPath = dataset/train/images

# Path del file CSV contenente il mapping tra il path delle immagini generate e le relative label
imageMapping = dataset/train/imageMapping.csv

# Strategia di mapping da utilizzare per costruire l'immagine
# Valori possibili:
# LINEAR | ZIGZAG | SERPENTINE
mappingType = LINEAR

# Larghezza dell'immagine
width = 224

# Altezza dell'immagine
# Se valorizzata -> modalità FIXED
# Se lasciata a 0 -> modalità VARIABLE
height = 224

# Numero di canali dell'immagine
# 1 -> grayscale (1 byte per pixel)
# 3 -> RGB (3 byte per pixel)
numberOfChannels = 3

# Larghezza per il resize delle immagini
resizeWidth = 0

# Altezza per il resize delle immagini
resizeHeight = 0

[TRAIN_CONFIGURATION]

# Abilita o disabilita la fase di training
# 1 -> esegue il training
# 0 -> salta questa fase
enabled = 0

# Path del file CSV contenente il mapping immagini-label per il training
imageMapping = dataset/train/imageMapping.csv

# Numero di epoche
epochs = 10

# Learning rate
learningRate = 0.001

# Path dove salvare il modello migliore
modelPath = models/best_model

[TEST_CONFIGURATION]

# Abilita o disabilita la fase di test
# 1 -> esegue il test
# 0 -> salta questa fase
enabled = 1

# Path del file CSV contenente il mapping immagini-label
imageMapping = dataset/test/imageMapping.csv

# Path del modello salvato durante il training
modelPath = models/best_model

# Path dove salvare la matrice di confusione
confusionMatrixPath = results/confusion_matrix.png